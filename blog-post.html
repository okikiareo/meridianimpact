<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Meridian Impact</title>
    <link rel="icon" type="image/svg+png" href="./img/meridian-logo-1.png" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css" />
    <link rel="stylesheet" href="blog.css" />
    
</head>
<body>
   

    <!-- Blog Post Content -->
    <article class="blog-post-container">
        <!-- Loading State -->
        <div id="post-loading" class="post-loading">
            <p>Loading post...</p>
        </div>

        <!-- Post Content (will be populated by JavaScript) -->
        <div id="post-content" class="post-content" style="display: none;">
            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span id="breadcrumb-title"></span>
            </div>

            <!-- Post Header -->
            <header class="post-header">
                <div class="post-category-badge" id="post-category"></div>
                <h1 class="post-title" id="post-title"></h1>
                <div class="post-meta">
                    <span class="post-author" id="post-author"></span>
                    <span class="post-date" id="post-date"></span>
                </div>
            </header>

            <!-- Featured Image -->
            <div class="post-featured-image">
                <img id="post-image" src="" alt="">
            </div>

            <!-- Post Body -->
            <div class="post-body" id="post-body"></div>

            <!-- Share Section -->
            <div class="post-share">
                <h3>Share this post</h3>
                <div class="share-buttons">
                    <a href="#" class="share-btn whatsapp" id="share-whatsapp" target="_blank">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.52 3.48A11.86 11.86 0 0012.04 0C5.49 0 .2 5.29.2 11.84c0 2.09.55 4.14 1.6 5.95L0 24l6.41-1.67a11.86 11.86 0 005.63 1.43h.01c6.55 0 11.84-5.29 11.84-11.84 0-3.16-1.23-6.13-3.47-8.44zM12.05 21.5a9.63 9.63 0 01-4.9-1.34l-.35-.21-3.8.99 1.01-3.7-.23-.38a9.63 9.63 0 1118.27-4.02c0 5.31-4.32 9.63-9.64 9.63zm5.27-7.2c-.29-.15-1.72-.85-1.99-.95-.27-.1-.46-.15-.66.15-.19.29-.76.95-.93 1.15-.17.19-.34.22-.63.07-.29-.15-1.22-.45-2.32-1.44-.86-.76-1.44-1.7-1.61-1.99-.17-.29-.02-.44.13-.59.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.19.05-.37-.02-.51-.07-.15-.66-1.59-.91-2.18-.24-.58-.48-.5-.66-.51h-.56c-.19 0-.49.07-.75.37-.26.29-.98.96-.98 2.33s1 2.69 1.14 2.88c.15.19 1.97 3 4.78 4.21.67.29 1.2.46 1.61.59.68.22 1.3.19 1.79.12.55-.08 1.72-.7 1.96-1.38.24-.68.24-1.26.17-1.38-.07-.12-.26-.19-.55-.34z"/>
                        </svg>
                        WhatsApp
                    </a>
                    <a href="#" class="share-btn twitter" id="share-twitter" target="_blank">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                        Twitter
                    </a>
                    <a href="#" class="share-btn facebook" id="share-facebook" target="_blank">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Facebook
                    </a>
                    <a href="#" class="share-btn linkedin" id="share-linkedin" target="_blank">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"/>
                        </svg>
                        LinkedIn
                    </a>
                </div>
            </div>

            <!-- Back to Blog -->
            <div class="post-navigation">
                <a href="blog.html" class="back-to-blog">← Back to All Posts</a>
            </div>
        </div>

        <!-- Error State -->
        <div id="post-error" class="post-error" style="display: none;">
            <h2>Post Not Found</h2>
            <p>Sorry, we couldn't find the blog post you're looking for.</p>
            <a href="blog.html" class="back-to-blog">← Back to All Posts</a>
        </div>
    </article>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    <script src="blog.js"></script>
</body>
</html>
